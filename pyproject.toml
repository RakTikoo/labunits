[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "labunits"
version = "0.1.0"
description = "Batch-convert lab-result CSV columns between conventional (US) and SI units -- only with factors verified against two authorities."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "RakTikoo" },
]
keywords = ["medicine", "laboratory", "units", "si-units", "conversion", "csv"]
classifiers = [
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = []

[project.scripts]
labunits = "labunits.cli:main"

[project.urls]
Homepage = "https://github.com/RakTikoo/labunits"

[tool.setuptools]
packages = ["labunits"]
